# Render Blueprint - deploys the app + a free Postgres database
# together. On Render: New + -> Blueprint -> connect this repo -> it
# reads this file automatically. Verified live: this exact file
# deployed successfully at https://invoiceiq-owo3.onrender.com.
#
# What this does NOT do: run Ollama. Free tiers don't have the RAM
# for it. The deployed app works fully for invoice CRUD, dashboard,
# approvals, etc. without any LLM at all; AI agent features fall back
# to their existing "LLM unavailable" behavior (see each agent's
# LLMUnavailableError handling) unless GROQ_API_KEY is set below, in
# which case every agent uses Groq's free-tier hosted API instead of
# a local model - see app/services/llm_client.py.

databases:
  - name: invoiceiq-db
    plan: free
    databaseName: invoiceiq
    user: invoiceiq

services:
  - type: web
    name: invoiceiq
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoiceiq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_NAME
        value: InvoiceIQ
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      # Optional. Leave unset to keep the cloud deployment LLM-free (the
      # default, always free). Get a free key at https://console.groq.com/keys
      # and paste it into the Render dashboard - sync: false means Render
      # will prompt for it interactively rather than expecting a value here,
      # so it's never committed to the repo.
      - key: GROQ_API_KEY
        sync: false
