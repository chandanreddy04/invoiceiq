<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Invoice{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
        table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
        th { background: #f7f7f7; }
        .badge { padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.85em; background: #eee; }
        .badge.paid { background: #d4edda; color: #155724; }
        .badge.unpaid { background: #fff3cd; color: #856404; }
        button, .btn { margin-top: 1.25rem; padding: 0.6rem 1.4rem; background: #2a5db0; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 1em; }
        .btn.secondary { background: #999; }
        .flash { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; }
        .flash.success { background: #d4edda; color: #155724; }
        .flash.info { background: #eaf2ff; color: #1a3d6d; }
        .totals { text-align: right; font-size: 1.1em; }
        footer { margin-top: 2rem; font-size: 0.8em; color: #999; text-align: center; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    <footer>Powered by InvoiceIQ</footer>
</body>
</html>
